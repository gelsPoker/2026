<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica Incorporacion js</title>
    <link rel="stylesheet" href="./CSS/style1.css">
</head>
<body>
    <section>
        <h1>Registro de Personas</h1>
        <form action="" id="formularioPersona">
            <div>
                <label for="nombre">Nombre:</label>
                <input 
                    type="text" 
                    name="nombre" 
                    id="nombre">
            </div>
            <div>
                <label for="rut">Rut:</label>
                <input 
                    type="text" 
                    name="rut" 
                    id="rut">
            </div>
            <div>
                <label for="direccion">Direccion:</label>
                <input 
                    type="text" 
                    name="direccion" 
                    id="direccion">
            </div>
            <button type="submit">Enviar</button>
        </form>
        <div>
            <h2>Resultados</h2>
            <p id="resultados"></p>
        </div>
    </section>

    <script src="./JavaScript/PersonasPractica.js"></script>
</body>
</html>
